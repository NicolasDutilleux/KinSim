# ============================================================
# KinSim configuration — biology and refinement parameters
#
# Centralised knowledge file for the data pipeline. Edit values here to
# adjust extraction, refine, and analysis behaviour without touching code.
# ============================================================

# Per-modification kinetic signature: where the IPD/PW signal is observable
# relative to the modified base position (PacBio HiFi).
#
# IMPORTANT — USERS MUST FILL THIS IN for every methylation type their data
# contains. The signature offsets drive the refine step: GMM clustering
# happens at these specific positions of the kinetic profile, and a sample
# must look "real meth" at every signature offset to be kept.
#
# If a methylation type is missing here, KinSim falls back to `[0]` (signal
# expected only at the modification position itself). This is correct for
# m4C but WRONG for m5C (whose signal is at +2 and +6, not at the C).
#
# Reference: PacBio "Detecting DNA Base Modifications" application note.
# If you discover a strain-specific signature (e.g. m6A at +8 instead of +5),
# add or override the entry here — no code change needed.
kinetic_signatures:
  m6A:
    signal_offsets: [0, 5]      # at the modified A AND ~5 bases downstream
    description: "Signal at modified A and +5 downstream"
  m4C:
    signal_offsets: [0]         # at the modified C only
    description: "Signal at modified C only"
  m5C:
    signal_offsets: [2, 6]      # +2 and +6 downstream — NOT at the C itself
    description: "Signal at +2 and +6 downstream of modified C"
  # Add new methylation types here, e.g.:
  # m4mC:
  #   signal_offsets: [0, 3]
  #   description: "..."

# Methylation context window fed to the model (FiLM input).
# The window is asymmetric and biased UPSTREAM because all kinetic signatures
# are downstream of the modification — to predict IPD at a position Y we need
# to see modifications upstream of Y (whose downstream effect reaches Y).
meth_context:
  left:  7     # bases before prediction position
  right: 3     # bases after prediction position
  # total length = left + 1 + right = 11
  # Inspired by Feng et al. 2013 (kineticsTools) [-7, +2] for unmodified DNA,
  # extended to 11 bases. The window is asymmetric upstream because all
  # kinetic signatures (m6A +5, m5C +2/+6) are downstream of the modification
  # — so to predict IPD at position Y the model needs to see modifications
  # that are upstream of Y (whose downstream effect reaches here).

# Kinetic profile extracted alongside each sample. Used by refine to validate
# the signature pattern. Range covers all known signature offsets with a
# safety margin.
kinetic_profile:
  start: 0     # offset relative to prediction position (inclusive)
  end:   8     # offset (inclusive)
  # length = end - start + 1 = 9

# Extraction parameters (v4)
#
# v4 changes how kinsim extract emits samples:
#   - For each *confirmed* methylation at p of type T (i.e. (kmer, T) is a
#     bucket present in the master_clean.pkl produced by refine pass-1),
#     positions p+k for k in signature_offsets[T] are flagged "slowed".
#   - Slowed positions are ALWAYS emitted (no subsampling) — they carry the
#     downstream kinetic footprint of the upstream methylation.
#   - Confirmed methylated positions (the meth itself, k=0) are emitted as
#     CATEGORY_METH samples.
#   - All other positions in the read are baseline candidates, capped per
#     kmer at `n_baseline_per_kmer` via reservoir sampling. The baseline must
#     also be at least `baseline_min_dist_to_meth` bases away from any
#     confirmed methylation in either direction so its meth_context window
#     never accidentally contains a methylation.
extract:
  n_baseline_per_kmer:        50    # cap on baseline samples per kmer
  baseline_min_dist_to_meth:  11    # in bases; must be >= K (kmer size)

  # NEAR_METH window: positions p+k where k in [1, near_meth_max_dist] and
  # k is NOT a signature offset for the meth at p. These positions are close
  # to a methylation (so meth_context will carry the meth) but NOT at an
  # offset where the polymerase slowing is biophysically expected. They
  # serve as negative controls: the model must learn that "meth in mc" alone
  # does not imply elevated IPD — only meth at a signature offset does.
  near_meth_max_dist:         7     # bases downstream of meth (1..K-1)

# Refinement parameters
refine:
  # Strategy applied per-type. All currently use the same algorithm
  # (GMM + signature validation), parameterised by the offsets above.
  default_strategy: "gmm_signature"

  gmm_signature:
    # Maximum K to try in the GMM. BIC selects best K in [1, k_max].
    k_max: 3

    # Mahalanobis threshold against None for component centroid validation.
    # 9.21 = chi2_{2dof, 0.99} = "1% chance of being None".
    chi2_threshold: 9.21

    # Minimum profile signal ratio at signature offsets vs baseline.
    # A component must have mean(IPD at signature_offsets) >= ratio * baseline_IPD.
    # baseline_IPD is the mean at non-signature positions of the profile.
    min_signature_ratio: 1.3

    # Minimum mixing weight (pi) for a component to be considered.
    min_pi: 0.05

    # Below this sample count, skip GMM and use direct Mahalanobis filter.
    min_samples_for_gmm: 5

    # Below this sample count, the bucket is too small even for Mahalanobis;
    # keep all samples without refinement (single-Gaussian fit on the data).
    min_samples_low: 1

  # ---------- v4: secondary p95 filter on slowed samples ----------
  # The v4 extract emits CATEGORY_SLOWED at every motif-match center +
  # signature offsets. Some of these are FP (motif scan can be noisy or
  # the methylation at p might not actually be active). The p95 filter
  # drops slowed samples whose IPD is below the p95 of the BASELINE
  # distribution — those are samples whose expected slowing did not
  # actually occur, so they're FP for our purposes.
  slowed_split:
    secondary_percentile: 95
