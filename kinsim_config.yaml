# ============================================================
# KinSim configuration — biology and refinement parameters
#
# Centralised knowledge file for the data pipeline. Edit values here to
# adjust extraction, refine, and analysis behaviour without touching code.
# Every consumer (extract, refine, analyze, generate, train) reads from
# this file via `kinsim.utils.config.load_kinsim_config()`. Adding a new
# methylation type, changing a signature offset, or tweaking baseline
# subsampling is a YAML edit only — never touch source.
# ============================================================

# ─────────────────────────────────────────────────────────────────────────
# Per-modification kinetic signature
# ─────────────────────────────────────────────────────────────────────────
# Each entry declares one methylation type. KinSim refuses to run if a
# type appears in your motifs.csv but is missing here (no silent
# fallback — see kinsim/utils/config.py:get_signature_offsets).
#
# Required fields per entry:
#   modified_base   one of A/C/G/T — concrete base this mod sits on. Used
#                   by the motif-position validator (kinsim/utils/motifs.py:
#                   _validate_mod_pos) to refuse motifs.csv rows whose
#                   `centerPos` doesn't actually point to a base of this
#                   chemistry. m6A modifies adenine (A); m4C and m5C both
#                   modify cytosine (C).
#   signal_offsets  list of integer offsets (in bases, downstream of the
#                   modified base) where the polymerase pause is
#                   biophysically expected. Drives extract's CATEGORY
#                   tagging (positions p+k for k in signal_offsets become
#                   CATEGORY_SLOWED) and analyze's per-(meth, offset)
#                   bucketing in the diagnostic plots.
#
# Optional:
#   description   free text shown in logs.
#
# Reference: PacBio "Detecting DNA Base Modifications" application note —
# 5-mC has signals 2 and 6 bases downstream; 4-mC at the modification
# only; 6-mA at the modification and often +5 downstream. Strain-specific
# signatures (e.g. m6A at +8 in some R-M systems) override here.
kinetic_signatures:
  m6A:
    modified_base:  A           # base this modification sits on (one of A/C/G/T)
    signal_offsets: [0, 5]      # at the modified A AND ~5 bases downstream
    aliases:        [6mA, 6-mA] # extra names this type goes by in upstream caller outputs
    description: "Signal at modified A and +5 downstream"
  m4C:
    modified_base:  C
    signal_offsets: [0]         # at the modified C only
    aliases:        [4mC, 4-mC]
    description: "Signal at modified C only"
  m5C:
    modified_base:  C
    signal_offsets: [2, 6]      # +2 and +6 downstream — NOT at the C itself
    aliases:        [5mC, 5-mC, 5hmC]   # 5hmC (hydroxymethyl-C) is treated as m5C by KinSim
    description: "Signal at +2 and +6 downstream of modified C"
  # Add new methylation types here.
  #   modified_base   REQUIRED  the concrete base (A/C/G/T) this mod sits on.
  #                             The motif-position validator (parse_motifs)
  #                             rejects motifs.csv rows whose centerPos
  #                             doesn't actually point to a base of this
  #                             chemistry, so this field is what makes
  #                             KinSim reject bogus inputs.
  #   signal_offsets  REQUIRED  list of int offsets (downstream of the
  #                             modified base) where the polymerase pause
  #                             is biophysically expected. Drives extract's
  #                             SLOWED tagging and analyze's per-(meth,
  #                             offset) bucketing.
  #   aliases         OPTIONAL  alternative names for the same modification
  #                             type as they may appear in upstream caller
  #                             output (e.g. modkit prints '5mC' for m5C).
  #                             CombinedParser maps any alias to the
  #                             canonical name; PacBio motifs.csv normally
  #                             uses canonical names directly.
  #   description     OPTIONAL  free text for logs.
  # Example: hypothetical N4-methylcytosine variant
  # m4mC:
  #   modified_base:  C
  #   signal_offsets: [0, 3]
  #   aliases:        [4mmC, m4mC]
  #   description: "..."

# ─────────────────────────────────────────────────────────────────────────
# Extraction window — kmer geometry AND methylation context
# ─────────────────────────────────────────────────────────────────────────
# The same window drives BOTH the kmer the model sees AND the methylation
# context fed to FiLM — they are linked by design (a kmer of length K at
# position p inherently means "meth context [-upstream, +downstream] from
# p"). Editing this block re-shapes every shard, every model dimension,
# every checkpoint produced downstream.
#
# Constraint (enforced at config load, error otherwise):
#     upstream + 1 + downstream == kmer_size
#
# To run a wider symmetric context (e.g. 21 bp with the active site at the
# centre), change to:
#     kmer_size: 21
#     upstream:  10
#     downstream: 10
# That single change propagates through extract, refine, train, generate.
# The shards carry these params in `__meta__["extraction_params"]` so
# `kinsim train` refuses to mix shards built with different geometries
# (and refuses to train a model whose YAML disagrees with the shards).
#
# Default (K=11, upstream-heavy [-7, +3]) is inspired by Feng et al. 2013
# (kineticsTools / ipdSummary, [-7, +2] for unmodified DNA), widened by
# one. PacBio kinetic signatures sit DOWNSTREAM of the modification, so
# the asymmetric layout puts more bases on the upstream side where the
# polymerase has already passed.
extraction:
  kmer_size:        11           # total window length (must equal upstream + 1 + downstream)
  upstream:         7            # bases of context BEFORE the prediction position
  downstream:       3            # bases of context AFTER the prediction position
  # Complementary-strand methylation captured at the active-site footprint
  # (offsets are RELATIVE to the active site, NOT to the kmer start).
  # Used by FiLM to disambiguate bilateral / palindromic motifs.
  # Most setups can leave this at [-1, 0, +1] regardless of kmer_size.
  rev_meth_offsets: [-1, 0, 1]

# ─────────────────────────────────────────────────────────────────────────
# Extraction parameters
# ─────────────────────────────────────────────────────────────────────────
# Controls how `kinsim extract` walks each read of each BAM and emits
# rows of the per-sample storage layout (20 cols, see
# kinsim/utils/sample_layout.py). For every motif-match position p of
# type T:
#   - positions p+k for k in signal_offsets[T]  → CATEGORY_SLOWED
#     (real kinetic footprint expected here)
#   - positions p+k for k in [1..near_meth_max_dist] and k NOT in
#     signal_offsets[T]                          → CATEGORY_NEAR_METH
#     (negative-control: meth in context but no slowing expected)
#   - positions ≥ baseline_min_dist_to_meth from any motif → BASELINE
#     candidates, capped per kmer via reservoir sampling.
extract:
  n_baseline_per_kmer:        50    # cap on baseline samples per kmer (Vitter reservoir)
  baseline_min_dist_to_meth:  11    # min distance (bases) from any motif. Must be >= K
                                    #   so the meth_context window of a baseline never
                                    #   accidentally overlaps a motif.

  # Front-end subsampling of baseline CANDIDATES before the reservoir.
  # 10 % means we randomly skip 90 % of would-be baseline positions
  # before any per-position work. The reservoir cap still guarantees
  # uniform-ish per-kmer sampling; this just trades a tiny uniformity
  # loss for ~10× speedup and ~10× less memory in the dict overhead.
  # On a 17 kb HiFi read with sparse motifs: ~17 k baseline candidates
  # → ~1.7 k after this filter → 50/kmer after the reservoir.
  baseline_sample_rate:       0.10  # in [0, 1]; 1.0 = no front-end skip

  # Range scanned for NEAR_METH labelling. Each motif at p contributes
  # NEAR_METH labels at p+k for k in [1, near_meth_max_dist] minus any k
  # that IS a signature offset (those are SLOWED, not NEAR). Used as a
  # negative control during training: the model must learn that "meth
  # somewhere in the meth_context" alone does NOT imply elevated IPD —
  # only meth at a configured signal offset does.
  near_meth_max_dist:         7     # bases downstream of the motif centre (1..K-1)

# ─────────────────────────────────────────────────────────────────────────
# Generation
# ─────────────────────────────────────────────────────────────────────────
# Per-read firing at generate time. extract marks all motif sites SLOWED;
# refine learns p_fire from what survives the GMM (absorbs both unmethylated
# sites AND CCS-noise non-firing reads). At generate, p_fire alone drives
# the per-read Bernoulli — multiplying by the per-site motif fraction would
# double-count what p_fire already captured. Set use_motif_fraction: true
# to recover the legacy decomposition.
generation:
  use_motif_fraction: false

# Training hyperparameters are CLI flags only. See `kinsim train --help`
# for the full list (epochs, lr, conv_dim, kernel_size, head_dim, loss,
# augment, balance_kmers, biology_mask, log_sigma_clamp_max, ...). The
# `--config <path>` flag accepts a flat YAML overriding any of those.
