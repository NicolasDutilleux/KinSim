[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kinsim"
version = "0.4.0"
description = "PacBio kinetic signal simulator for metagenomic binning"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pysam",
    "scikit-learn",
]

[project.scripts]
kinsim      = "kinsim.__main__:main"
kinsim-prep = "prep.__main__:main"

[project.optional-dependencies]
ml      = ["torch>=2.0", "pytorch-lightning>=2.0"]
hpo     = ["optuna"]
plot    = ["matplotlib"]
tb      = ["tensorboard"]

[tool.setuptools.packages.find]
include = ["kinsim*", "prep*"]
