# ============================================================
# KinSim — Full pipeline configuration
#
# Usage:
#   kinsim train --config config.yaml
#   sbatch slurm_kinsim/kinsim_mlp_train.slurm --config config.yaml
#
# All values shown are defaults. Remove a key to use the default.
# Command-line flags always override YAML values.
# ============================================================

# ---- Input / output ----
pkl:        /data/projects/p774_MARSD/NDutilleux/training/combined_train.pkl
output_dir: /data/projects/p774_MARSD/NDutilleux/checkpoints_mlp/

# ============================================================
# PIPELINE PARAMETERS
# These must be consistent across extract → train → generate.
# ============================================================

# K-mer window size. Must be ODD (center position = kmer_size // 2).
# Changing this requires re-extracting all shards.
# Default: 11  (22-bit keys, 4^11 = 4.19M possible k-mers)
# Larger (e.g. 15): more context, slower extract, exponentially more keys
# Smaller (e.g. 7):  less context, faster, fewer keys
kmer_size: 11

# ============================================================
# TRAINING PARAMETERS
# ============================================================

epochs:           100       # total training epochs (stop early if satisfied)
batch_size:       4096      # mini-batch size (samples per gradient step)
                            # reduce to 2048 if GPU OOM
lr:               0.001     # initial Adam learning rate
loss:             gnll      # gnll (Gaussian NLL) | mse | huber
                            # gnll trains both mean and variance heads
                            # mse/huber trains only the mean head (faster ablation)
val_fraction:     0.10      # fraction of keys held out for validation
checkpoint_every: 10        # save checkpoint every N epochs

# Learning rate schedule (ReduceLROnPlateau)
lr_patience:      5         # epochs without val improvement before LR halved
lr_factor:        0.5       # LR multiplied by this on plateau

# ============================================================
# MODEL ARCHITECTURE
# Choose architecture: "conv" (recommended) or "mlp" (legacy)
# ============================================================

architecture: conv          # conv (~140K params) | mlp (~268M params, embedding-heavy)

# --- ConvPredictor (architecture: conv) ---
# Per-base embedding + 1D conv backbone with FiLM methylation conditioning.
# Learns spatial rules (e.g. "A at offset -3 shifts IPD by X") rather than
# memorising each k-mer independently. Generalises to unseen k-mers.
base_embed_dim: 16          # per-base (A/C/G/T) embedding dimension
num_meth_types: 4           # number of methylation types (none/m6A/m4C/m5C)
meth_proj_dim:  8           # methylation projection output dimension
conv_dim:       128         # channel width for all Conv1d layers
n_conv_layers:  3           # number of Conv1d layers (depth of the backbone)
kernel_size:    3           # Conv1d kernel size (receptive field per layer)
head_dim:       128         # output head hidden layer width
dropout:        0.1         # dropout probability in output head

# --- MLPPredictor (architecture: mlp) ---
# Legacy flat embedding. Only used if architecture: mlp above.
# kmer_embed_dim: 64        # embedding table columns (32 = ~0.5 GB, 64 = ~1 GB)
# hidden_dim:     128       # width of the two hidden MLP layers
# meth_proj_dim:  8         # methylation linear projection output dimension
# dropout:        0.0

# ============================================================
# DEVICE
# ============================================================
device: cuda                # cuda | cpu (auto-falls-back to cpu if no GPU)

# ============================================================
# RESUME (optional)
# ============================================================
# resume: /data/projects/p774_MARSD/NDutilleux/checkpoints_mlp/checkpoint_epoch50.pt

# ============================================================
# OPTUNA HYPERPARAMETER SEARCH (optional)
# Run before the final training run to find good lr / arch params.
# Best values override the settings above.
# ============================================================
# optuna:        false      # set to true to enable HPO
# n_trials:      20         # number of Optuna trials
# optuna_epochs: 20         # epochs per trial (shorter than 'epochs')

# ============================================================
# EXTRACT PARAMETERS (for reference — passed via CLI, not YAML)
# These are shown here so the full pipeline is documented in one place.
# Pass them directly to: kinsim extract --manifest ... --kmer-size 11
# ============================================================
# max_samples_per_key: 20000   # reservoir cap per (kmer, meth) key per BAM
# min_fraction:        0.40    # min methylation fraction from PacBio CSV
# min_detected:        20      # min nDetected from PacBio CSV

# ============================================================
# BALANCE PARAMETERS (for reference — used with kinsim-prep balance)
# kinsim-prep balance merged.pkl balanced.pkl \
#     --meth-fraction 0.5 \
#     --samples-per-key 200
# ============================================================
# meth_fraction:    0.5    # target fraction of kept keys that are methylated
#                          # budget split evenly across all mod types present
# max_keys:         0      # 0 = keep all keys, only rebalance type distribution
# samples_per_key:  200    # diversity-subsample each key to N samples
#                          # uses IPD-quantile spacing for maximum spread
