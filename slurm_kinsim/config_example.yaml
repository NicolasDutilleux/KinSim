# ============================================================
# KinSim MLP — Training configuration
#
# Usage:
#   kinsim train --config config.yaml
#   sbatch kinsim_train.slurm --config config.yaml
#
# All values below are the defaults.  Remove a key to use the default.
# Command-line flags always override YAML values.
# ============================================================

# ---- Input / output ----
pkl:        /data/projects/p774/kinsim/master_data.pkl
output_dir: /data/projects/p774/kinsim/checkpoints_mlp/

# ---- Training ----
epochs:          50        # total training epochs
batch_size:      4096      # mini-batch size (number of unique keys per step)
lr:              0.001     # initial Adam learning rate
loss:            gnll      # loss function: gnll | mse | huber
val_fraction:    0.10      # fraction of data held out for validation
checkpoint_every: 10       # save a checkpoint every N epochs

# ---- Architecture ----
kmer_embed_dim: 64         # 11-mer embedding dimension (32 = ~0.5 GB, 64 = ~1 GB)
hidden_dim:     128        # width of the two hidden MLP layers
meth_proj_dim:  8          # methylation linear projection output dimension

# ---- Device ----
device: cuda               # cuda | cpu  (auto-falls-back to cpu if no GPU)

# ---- Resume (optional) ----
# resume: /data/projects/p774/kinsim/checkpoints_mlp/checkpoint_epoch25.pt

# ---- Optuna HPO (optional) ----
# Set optuna: true to run hyperparameter search before the final training run.
# Searches over: lr (log-uniform 1e-4..1e-2), kmer_embed_dim (32,64), hidden_dim (128,256,512).
# Best values override lr / kmer_embed_dim / hidden_dim above.
# optuna:        false    # set to true to enable HPO
# n_trials:      20       # number of Optuna trials
# optuna_epochs: 20       # epochs per trial (shorter than 'epochs')
