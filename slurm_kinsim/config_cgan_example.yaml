# ============================================================
# KinSim cGAN — Training configuration
#
# Usage:
#   kinsim train --model cgan --config config_cgan.yaml
#   sbatch kinsim_cgan_train.slurm --config config_cgan.yaml
#
# All values below are the defaults.  Remove a key to use the default.
# Command-line flags always override YAML values.
# ============================================================

# ---- Input / output ----
pkl:        /data/projects/p774/kinsim/master_data.pkl
output_dir: /data/projects/p774/kinsim/checkpoints_cgan/

# ---- Training ----
epochs:          100       # total training epochs
batch_size:      4096      # mini-batch size
lr:              0.0001    # Adam learning rate (same for G and D)
n_critic:        5         # discriminator updates per generator update
lambda_gp:       10        # gradient penalty weight (WGAN-GP)
checkpoint_every: 10       # save a checkpoint every N epochs

# ---- Architecture ----
noise_dim:      32         # latent noise vector dimension for Generator
kmer_embed_dim: 64         # 11-mer embedding dimension (32 = ~0.5 GB, 64 = ~1 GB)
hidden_dim:     128        # width of hidden layers in G and D

# ---- Device ----
device: cuda               # cuda | cpu

# ---- Resume (optional) ----
# resume: /data/projects/p774/kinsim/checkpoints_cgan/checkpoint_epoch50.pt
