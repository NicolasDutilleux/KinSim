name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - run: uv tool install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      # The smoke tests exercise both pure-numpy paths and tiny torch forward
      # passes (the generator/critic instantiation tests), so torch is required.
      # The CPU-only PyTorch wheel index is forced to avoid pulling the CUDA
      # build on a GitHub runner that has no GPU.
      - name: Install package
        run: |
          uv pip install --system --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[plot]" pytest pytest-cov
      - name: Run tests
        run: pytest --cov=kinsim_NN --cov-report=xml -v
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
