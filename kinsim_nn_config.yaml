# kinsim_NN — default config
#
# All defaults documented here. CLI flags override. See kinsim_NN/DESIGN.md.

# -- Window geometry -----------------------------------------------------
window:
  half_width: 10        # window = ±10 ref positions
  k: 21                 # K = 2*half_width + 1
  n_channels: 4         # IPD_fwd, PW_fwd, IPD_rev, PW_rev

# -- Methylation types (extensible) --------------------------------------
# id MUST be unique and start at 0 for 'none'. M = max(id)+1.
#
# signal_offsets: per meth type, the +k bp offsets relative to the meth
# position where the polymerase IPD slowdown is observed (v3 kinsim default
# values from SP3-C3 model). Used by `extract` to split samples into
# CATEGORY_SLOWED (at a signature offset of a meth) vs CATEGORY_NEAR_METH
# (close to a meth but NOT at a signature offset — control samples).
methylation_types:
  none:
    id: 0
  m6A:
    id: 1
    modified_base: A
    label_sources: [gff]
    signal_offsets: [0, 5]
  m4C:
    id: 2
    modified_base: C
    label_sources: [gff]
    signal_offsets: [0]
  m5C:
    id: 3
    modified_base: C
    label_sources: [gff, jasmine_mm_ml]
    signal_offsets: [2, 6]

# Treat GFF 'modified_base' (unclassified) as which type? Set to null to ignore.
treat_modified_base_as: m5C

# -- Labelers (modular) --------------------------------------------------
# Each entry has a `type` (registered name) and free-form kwargs. Order
# matters: earlier labelers win on conflicts.
labelers:
  - type: gff
    qv_threshold: 10                            # GFF score (modificationQv) cutoff
    file_pattern: "{strain_dir}/motifs.gff"
    require_motif: true                         # only keep lines with motif= attribute
                                                # (pbmotifmaker reprocess motif-confirmed
                                                # positions — filters out the ~96% noise
                                                # ipdSummary calls without motif support)
  # Optional second pass for 5mC from jasmine MM/ML tags. Disable by
  # commenting out if no jasmine output is available.
  # - type: jasmine_mm_ml
  #   ml_threshold: 200          # 0-255 scale (~78% confidence)
  #   file_pattern: "{strain_dir}/jasmine_5mC.bam"

# -- Extract ------------------------------------------------------------
extract:
  baseline_min_dist: 20         # min bp from any meth position
  baseline_per_strain: 50000    # number of baseline samples per strain
  reads_cap_per_position: 20    # max reads emitted per labeled position
  min_mapq: 0                   # skip reads with mapping quality below this
                                # (0 = no filter; pbmm2 often assigns mapq=0
                                # on unique-only alignments which would otherwise
                                # be filtered out at >0 thresholds)
  # 0 = no cap (all GFF-labelled positions). For dense-meth strains (e.g.
  # Strepto ~400k positions per strain) BAM I/O dominates extract walltime;
  # cap to a random subsample to bound walltime. 100k is a sane default.
  meth_per_strain_cap: 0
  # Bystrandified pair combination: required if input BAM is bystrandified
  # (2 records/ZMW). Disabled if raw HiFi aligned (1 record/ZMW with fi/fp/ri/rp).
  bystrandify_pairing: true
  # 3-category labeling (v3-style). For each meth position p of type T,
  # expand into emission candidates at offsets [0, near_meth_max_dist]:
  #   k ∈ signal_offsets[T] → CATEGORY_SLOWED
  #   k ∉ signal_offsets[T] → CATEGORY_NEAR_METH
  # Defaults: NO cap on SLOWED/NEAR_METH (keep everything — they're precious
  # signal and ~complete-genome-coverage control respectively). meth_per_strain_cap
  # is left at 0 so the parent expansion sees every labelled position. If you
  # need to bound BAM I/O on a 12 GB Strepto BAM, set meth_per_strain_cap > 0.
  near_meth_max_dist: 10
  slowed_per_strain_cap: 0             # 0 = no cap (keep all SLOWED)
  near_meth_per_strain_cap: 0          # 0 = no cap
  # Optional ambiguous-position avoidance. Reads motifs.gff WITHOUT the
  # require_motif filter — so it picks up ALL high-QV positions (both
  # motif-confirmed AND ambiguous ipdSummary calls). Baseline sampling
  # excludes the union. Result: 3 corpus tiers — METH (motif-confirmed,
  # labelled), AMBIGUOUS (high-QV no motif, neither labelled nor sampled),
  # BASELINE (≥baseline_min_dist from both). Set to null to disable.
  avoid_gff_pattern: "{strain_dir}/motifs.gff"
  avoid_gff_qv_threshold: 10.0

# -- Train / test split -------------------------------------------------
split:
  test_strains: [bc2034, bc2045, bc2048, bc2082]
  # Alternative: random per-shard split
  # test_fraction: 0.10
  # split_seed: 42

# -- Model architecture --------------------------------------------------
model:
  generator:
    d_model: 192
    n_layers: 6
    n_heads: 6
    z_dim: 64
    drop_rate: 0.0
    pos_embed_dim: 16
  discriminator:
    d_model: 128
    n_layers: 4
    n_heads: 4
    spectral_norm: true
    pos_embed_dim: 16

# -- Training -----------------------------------------------------------
train:
  loss: wgan_gp                 # only WGAN-GP supported for now
  batch_size: 256
  n_critic: 5                   # D updates per G update
  gradient_penalty_lambda: 10.0
  lr_g: 0.0001
  lr_d: 0.0004                  # TTUR: D is 4x faster
  beta1: 0.0                    # WGAN-GP standard
  beta2: 0.9
  n_steps: 200000
  checkpoint_every: 5000
  eval_every: 5000
  log_every: 100
  seed: 42
  num_workers: 4                # DataLoader workers (per-process)
  pin_memory: true

# -- Generation ---------------------------------------------------------
generate:
  use_fraction_bernoulli: true  # Bernoulli sample at each motif site with motif's fraction
  n_context_skip: 10            # skip first/last K/2 query positions per read (no full window)
  default_fi_for_unknown: 1     # uint8 value for N-context positions (1 = "no data")
